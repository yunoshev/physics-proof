<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="physics-proof: a measured check of one video clip">
<title>physics-proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="player.css">
<script type="application/json" id="analysis">__ANALYSIS__</script>
<script type="application/json" id="page-data">__PAGEDATA__</script>
</head>
<body>
<header id="site-header">
<p class="kicker" id="kicker"></p>
<h1 id="headline"></h1>
<p class="key-number" id="key-number"></p>
</header>
<main>
<section id="stage" aria-label="video">
<div id="screen">
<video id="clip" src="clip.mp4" playsinline preload="auto"></video>
<canvas id="overlay"></canvas>
</div>
<div id="controls">
<button id="btn-play" type="button"></button>
<button id="btn-back" type="button"></button>
<button id="btn-fwd" type="button"></button>
<button id="btn-prev" type="button"></button>
<button id="btn-next" type="button"></button>
<span id="frame-readout" class="mono"></span>
</div>
</section>
<nav id="steps-nav" aria-label="steps">
<h2 id="steps-heading"></h2>
<ol id="steps-list"></ol>
</nav>
<div id="steps"></div>
</main>
<noscript><p>physics-proof needs JavaScript to draw the measurement.</p></noscript>
<script src="player.js" defer></script>
</body>
</html>
