<!doctype html>
<!-- frozen player template (part 13). hash: __PP_TEMPLATE_HASH__ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@KATEX_VERSION_PIN/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@KATEX_VERSION_PIN/dist/katex.min.js"></script>
<style>
/*__PP_TEMPLATE_HASH__*/
:root{
  --page:#04070C; --header:#060B13; --panel:#070C14; --card:#05090F;
  --line:#1B2A3C; --line2:#22344A; --grid:#141E2C; --grid2:#3A4F68;
  --txt:#E8EEF4; --txt2:#9AA8B8; --mut:#66788C; --mut2:#7A8798;
  --cyan:#4FE3F0; --amber:#FFB54D; --peri:#8A8FFF; --mars:#FF7A4D;
  --red:#FF4D4D; --red2:#FF5A5A;
  --sans:-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Times New Roman",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--txt);font-family:var(--sans);overflow:hidden}
header{height:56px;background:var(--header);border-bottom:1px solid #162233;display:flex;align-items:center;gap:24px;padding:0 24px}
header h1{font-size:16px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:28px;margin-left:286px}
nav.tabs button{background:none;border:0;color:var(--mut2);font-size:13px;font-family:var(--sans);cursor:pointer;padding:4px 0}
nav.tabs button.on{color:var(--txt);font-weight:500;border-bottom:2px solid var(--cyan)}
main{display:flex;gap:12px;padding:14px 18px 0 18px;height:calc(100vh - 56px)}
#left{flex:0 0 68.4%;display:flex;flex-direction:column;min-width:0;min-height:0}
/* (42.4) the stage keeps the video's display aspect; fitStage sizes
   it into the free column space, so header, stage and controls stay
   fully visible with no page scroll */
#stage{position:relative;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:0 0 auto;margin:0 auto}
#side{flex:1;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:0}
/* (42.8) the chart sits on top, outside the column's scrolling area */
#chartBlock{flex:0 0 auto;padding:16px 16px 10px;border-bottom:1px solid #162233}
#sideInner{padding:16px;overflow-y:auto;flex:1;min-height:0}
/* (43.6) the bar grows with its label lanes so every label
   stays inside the control bar, never over the stage */
#controls{display:flex;align-items:center;gap:10px;height:auto;min-height:52px;flex:0 0 auto;color:var(--txt2);font-size:11px}
#playBtn{width:40px;height:40px;border-radius:50%;background:#DCE6EF;border:0;color:#000;font-size:14px;cursor:pointer}
.stepbtn{width:32px;height:32px;border-radius:4px;border:1px solid #2A3C52;background:#0A111C;color:var(--txt2);cursor:pointer;font-size:11px}
#timeline{position:relative;flex:1;height:56px;min-width:40px;padding-top:0;cursor:pointer;touch-action:none}
#timeline.tall{height:64px}
#timeline.pt2{padding-top:22px;height:70px}
#tlTrack{position:absolute;left:0;right:0;top:30px;height:2px;background:#22344A;pointer-events:none}
#tlPlay{position:absolute;left:0;top:30px;height:2px;background:var(--cyan);width:0;pointer-events:none}
#tlSegs,#tlTicks{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.tlseg{position:absolute;top:22px;height:5px;background:#1F6E73}
.tlseg span{position:absolute;bottom:8px;left:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--mut);white-space:nowrap}
.tlseg.grey{background:#3A4F68}
.tltick{position:absolute;top:30px;width:2px;height:10px;background:var(--amber)}
.tltick .tlbl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:140px;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:11px;color:var(--mut);white-space:nowrap}
#timeRead{font-family:var(--mono);font-size:12px;color:#C7D2DE;white-space:nowrap}
#speed{background:#0A111C;color:var(--txt);border:1px solid #2A3C52;border-radius:2px;font-family:var(--mono);font-size:12px;height:28px;width:62px}
.chk{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt2);white-space:nowrap}
.chk .box{width:14px;height:14px;border-radius:2px;border:1px solid var(--grid2);display:inline-block;text-align:center;line-height:12px;font-size:11px;color:#000}
.chk.on .box{background:var(--cyan);border-color:var(--cyan)}
/* video box: every stage layer shares it (29); the camera transform below
   is the ONLY zoom — the freeze canvas is always a whole-frame draw (30) */
#vbox{position:absolute;inset:0;transform-origin:0 0}
#vbox video,#vbox canvas#freeze{position:absolute;inset:0;width:100%;height:100%}
#vbox video{filter:contrast(1.06) saturate(.92)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.42) 95%)}
#dim{position:absolute;inset:0;background:rgba(2,4,8,0);pointer-events:none}
#stageOverlay{position:absolute;inset:0;pointer-events:none}
#stageOverlay svg{position:absolute;inset:0;width:100%;height:100%}
#ptitle{display:none}
#phoneSlot{display:none;max-width:100%;min-width:0}
.ov{font-family:var(--mono)}
#hud{position:absolute;top:18px;left:18px;font-family:var(--mono);font-size:11px;color:#C7D2DE;background:rgba(0,0,0,.72);padding:3px 8px;border-radius:2px;z-index:5}
#hud .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-right:6px}
#hud.frozen .dot{background:var(--amber)}
#hud .frz{color:var(--amber);font-weight:700;margin-left:12px}
#badge{position:absolute;top:18px;right:18px;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--cyan);border:1px solid var(--cyan);padding:3px 8px;border-radius:2px;background:rgba(0,0,0,.72);z-index:5}
/* (42.5) the HUD line and the SAM badge are gone from the visible
   page; geometry code still reads their (zero) rects. The keys keep
   working and the play button's title lists them. */
#hud,#badge{display:none}
#caption{position:absolute;left:18px;bottom:18px;z-index:5;max-width:70%}
#caption .t{background:rgba(0,0,0,.72);border-left:3px solid var(--amber);color:#FFF;font-size:24px;font-weight:700;padding:6px 12px}
#caption .n{background:rgba(0,0,0,.72);color:#C7D2DE;font-size:13px;padding:6px 12px;margin-top:2px}
#caption .n b{font-family:var(--mono);font-weight:700;color:#FFF}
#holdbar{position:absolute;top:0;left:0;height:2px;background:var(--amber);width:0;box-shadow:0 0 6px var(--amber);z-index:6}
#flash{position:absolute;inset:0;background:#DFF6FF;opacity:0;pointer-events:none;z-index:7}
#intro{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:safe center;padding:0 5%;background:rgba(4,7,12,.45);overflow-y:auto;pointer-events:none}
#intro button{pointer-events:auto}
#intro h2{font-size:42px;font-weight:800;line-height:1.05;color:#EDF3F8;margin:0 0 8px;max-width:62%}
#intro .sub{font-size:14px;color:var(--txt2);margin:0 0 6px;max-width:62%}
#intro .claim{font-size:13px;color:var(--txt2);margin:2px 0;max-width:62%}
#intro .claim b{color:var(--txt)}
#intro .checks{margin:4px 0 0;max-width:62%}
#intro .checks .h{font-size:11px;color:var(--mut2);margin-bottom:4px}
#intro .checkrow{font-size:12px;color:#D5DEE8;background:rgba(10,17,28,.88);border:1px solid var(--line2);border-radius:2px;padding:6px 10px;margin-bottom:4px;overflow-wrap:break-word}
#introCards{display:flex;gap:14px;width:92%;margin-top:10px}
.icard{flex:1;background:rgba(10,17,28,.88);border:1px solid var(--line2);border-radius:2px;padding:14px}
.icard .eb{font-size:11px;color:var(--mut2)}
.icard .big{font-family:var(--mono);font-size:30px;font-weight:700;color:#EDF3F8}
.icard .u{font-size:10px;color:var(--txt2)}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;border:1px solid #3A4F68;border-radius:10px;padding:3px 8px;color:#D5DEE8;margin:2px 4px 2px 0}
#watchBtn{background:var(--cyan);color:#000;font-weight:700;font-size:14px;border:0;border-radius:3px;padding:12px 18px;cursor:pointer;margin-top:12px}
#watchNote{font-size:11px;color:var(--txt2);margin-left:14px}
#refcard{position:absolute;top:17%;right:2.5%;width:38%;max-height:60%;overflow:hidden;background:rgba(7,12,20,.92);border:1px solid var(--line2);border-top:2px solid var(--amber);border-radius:2px;padding:16px;z-index:5}
#refcard .eb{font-size:11px;color:var(--mut2)}
#refcard h3{font-size:14px;margin:2px 0 6px}
#refcard .huge{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--amber)}
#refcard .huge small{font-size:13px;color:var(--txt2)}
#refcard .cap{font-size:11px;color:var(--txt2)}
#refcard .src{font-size:11px;color:var(--txt2);margin-top:6px;font-style:italic}
#refcard .src b{font-family:var(--mono);font-style:normal;color:var(--amber);font-size:12px;display:inline-block;width:28%}
#verdict{position:absolute;left:6%;right:6%;bottom:4%;background:rgba(5,9,15,.94);border:1px solid #2A3C52;border-radius:2px;padding:20px 24px;z-index:5}
#verdict .eb{font-size:12px;color:var(--mut2)}
#verdict .g{font-family:var(--mono);font-size:40px;font-weight:700}
#verdict .g small{font-size:18px;color:#8A99AB}
#gauge{position:relative;height:88px;margin:8px 0}
#gaxis{position:absolute;left:0;right:0;top:52px;height:1px;background:var(--grid2)}
.gtick{position:absolute;top:48px;width:1px;height:9px;background:var(--grid2)}
.gtick span{position:absolute;top:-16px;left:-14px;width:40px;text-align:center;font-family:var(--mono);font-size:9px;color:var(--mut)}
.gunit{position:absolute;right:2px;bottom:0;font-family:var(--mono);font-size:11px;color:var(--mut2)}
.gmark{position:absolute;top:38px;width:2px;height:18px}
.gmark span{position:absolute;bottom:30px;left:-32px;width:84px;text-align:center;font-size:12px;font-weight:700;font-family:var(--mono)}
.gband{position:absolute;top:48px;height:8px;background:rgba(79,227,240,.25)}
#stamp{position:absolute;top:-32px;right:6%;border:3px double;padding:6px 14px;transform:rotate(-6deg);background:rgba(4,7,12,.85);text-align:center;max-width:44%}
#stamp .w{font-weight:800;font-size:32px;white-space:nowrap}
#stamp .s{font-family:var(--mono);font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.6em}
#verdict .sent{font-size:13px;color:#C7D2DE;margin-top:6px}
.sigrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sig{font-family:var(--mono);font-size:11px;border:1px solid;border-radius:10px;padding:4px 10px;background:transparent;overflow-wrap:anywhere;max-width:100%}
/* (41) world chips wrap; they never overflow the verdict card */
.sigrow .sig{flex:0 1 auto;min-width:0}
#revealBtn{background:transparent;border:1px solid var(--grid2);color:#D5DEE8;font-size:12px;padding:8px 14px;border-radius:2px;cursor:pointer;margin-top:10px}
#gtBlock{font-size:13px;margin-top:8px}
#gtBlock .eb{font-size:11px;color:var(--mut2)}
.rbar{margin:10px 0}
.rbar .track{position:relative;height:8px;background:#16222F;border-radius:2px}
.rbar .typ{position:absolute;top:-3px;width:2px;height:14px;background:#8A99AB}
.rbar .mark{position:absolute;top:-5px;width:3px;height:18px}
.rbar .band2{position:absolute;top:-3px;height:14px;opacity:.35}
.rbar .dom{font-family:var(--mono);font-size:10px;color:var(--mut2);margin-top:6px}
.rbar .side{font-family:var(--mono);font-size:11px;margin-top:2px}
#chartHead{display:flex;justify-content:space-between;align-items:baseline}
#chartHead h3{font-size:13px;margin:0}
#chartHead .u{font-family:var(--mono);font-size:11px;color:var(--mut2)}
#legendRow{display:flex;gap:14px;font-size:10px;color:var(--txt2);margin:4px 0}
#legendRow i{display:inline-block;width:14px;height:0;border-top:2px solid;margin-right:4px;vertical-align:middle}
#chart{width:100%;height:150px;display:block;background:var(--card)}
#chartEmpty{font-size:11px;color:var(--txt2);text-align:center;padding-top:60px}
#steps{position:relative;padding-left:22px}
#steps::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:#1E2C3E}
.step{position:relative;margin:0 0 14px}
.step .sdot{position:absolute;left:-19px;top:3px;width:9px;height:9px;border-radius:50%;border:1px solid #3A4F68;background:var(--panel)}
.step.open .sdot{border-color:var(--cyan)}
.step.cur .sdot{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.step .shead{display:flex;justify-content:space-between;cursor:pointer}
.step .st{font-size:13px;font-weight:500;color:#5F7085}
.step.open .st{font-weight:700;color:var(--txt)}
.step .sfr{font-family:var(--mono);font-size:10px;color:var(--mut);white-space:nowrap}
.step .sbody{display:none;font-size:12px;color:var(--txt2);line-height:1.45}
.step.open .sbody{display:block}
.step .sbody .ln{opacity:0;transition:opacity .45s}
.step .sbody .ln.shown{opacity:1}
.fx{font-family:var(--serif);font-style:italic;font-size:14px;color:#D5DEE8;margin:6px 0}
.fx .katex{font-size:14px}
.fx .fb{font-family:var(--mono);font-style:normal;font-size:12px;color:#D5DEE8}
/* (39) wordy formulas are plain monospace text, never math italics */
.fx.plain{font-family:var(--mono);font-style:normal;font-size:12px}
.chip{display:inline-block;font-family:var(--mono);font-weight:700;font-size:13px;padding:4px 8px;border-radius:2px;margin:4px 0}
.chip.final{background:var(--amber);color:#0A0A0A}
.chip.inter{background:transparent;border:1px solid var(--cyan);color:var(--cyan)}
.warn{border-left:3px solid var(--amber);background:rgba(255,181,77,.08);color:#D8C9A8;font-size:11px;padding:6px 10px;margin:6px 0}
.bars .brow{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt2);margin:3px 0}
.bars .bl{flex:0 0 55%}
.bars .bt{width:90px;height:5px;background:#16222F}
.bars .bf{height:5px;background:var(--cyan)}
.bars .bp{font-family:var(--mono);font-size:11px;color:var(--txt);flex:0 0 12%;text-align:right;white-space:nowrap}
.mchkimg{width:100%;height:150px;object-fit:contain;object-position:top left;background:#05090F;border:1px solid #24334A;display:block}
#mchkChip{display:block;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;max-width:100%}
.mchkcap{font-size:11.5px;color:var(--mut2)}
#summaryBlock{border:1px solid var(--line2);border-radius:2px;padding:12px;margin:10px 0;background:rgba(5,9,15,.6)}
#summaryBlock h4{margin:0 0 6px;font-size:13px}
#howmade{font-size:11px;color:var(--txt2)}
.kb{font-size:11px;color:var(--mut2);margin-top:8px}
text{user-select:none}
@media (max-width:700px){
  /* (42.4) one screen on a phone too: the column goes below the
     control bar and only the column scrolls, never the page */
  main{flex-direction:column;height:100dvh;overflow:hidden}
  #left{flex:none}
  #side{flex:1 1 auto;min-height:0}
  #controls{position:sticky;bottom:0;background:var(--page);flex-wrap:wrap;height:auto;min-height:52px;row-gap:6px}
  header{display:none}
  /* phone: the question lives above the video, never twice (35) */
  #ptitle{display:block;font-size:22px;font-weight:800;color:#EDF3F8;margin:0 0 8px;line-height:1.2}
  /* phone: the timeline gets its own full-width row, never squeezed (35) */
  #timeline{flex:1 1 100%;order:9}
  /* phone: the intro starts below the HUD and scrolls, never cut (35) */
  #intro{padding-top:52px;pointer-events:auto;overflow-y:auto}
  /* phone: the verdict and reference cards go below the video,
     not over it (35) */
  #phoneSlot{display:block}
  #verdict.below{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:8px 0 0;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere}
  /* (39) nothing sticks out on a phone: the slot and the side column
     clip inside the viewport instead of widening the document */
  #side{min-width:0;max-width:100%}
  #sideInner{overflow-x:hidden}
  .rbar .dom{overflow-wrap:anywhere}
  #refcard.below{position:relative;width:auto;max-height:none;margin:8px 0 0;
    top:auto;bottom:auto;right:auto;overflow:visible}
  #hud{font-size:10px;max-width:64%;top:8px;left:8px}
  #badge{font-size:9px;top:8px;right:8px}
  #intro h2{font-size:30px}
  #introCards{flex-direction:column}
  #caption .t{font-size:18px}
  .stepbtn{width:28px;height:28px}
  #timeRead{font-size:11px}
  .chk{font-size:10px}
  /* phone: compact card, clipped with … by clampCardText, clear of
     the caption below (35) */
  #refcard{width:56%;max-height:42%;padding:10px;overflow:hidden}
  #verdict{padding:14px}
  #verdict .g{font-size:28px}
}
</style>
</head>
<body>
<header><h1 id="ttl">Player</h1><nav class="tabs" id="tabs"></nav></header>
<main>
<div id="left">
  <div id="ptitle"></div>
  <div id="stage" data-testid="stage">
    <div id="vbox">
      <video id="vid" playsinline preload="auto" muted></video>
      <img id="posterImg" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000">
      <canvas id="freeze"></canvas>
      <div id="vig"></div><div id="dim"></div>
      <div id="stageOverlay" data-testid="stage-overlay"><svg id="ov" preserveAspectRatio="none"></svg></div>
    </div>
    <div id="hud"><span class="dot"></span><span id="hudTx"></span><span class="frz" id="hudFrz" style="display:none"></span></div>
    <div id="badge"></div>
    <div id="caption" style="display:none"><div class="t" id="capT"></div><div class="n" id="capN"></div></div>
    <div id="refcard" style="display:none"></div>
    <div id="verdict" style="display:none"></div>
    <div id="holdbar"></div><div id="flash"></div>
    <div id="intro"></div>
  </div>
  <div id="phoneSlot"></div>
  <div id="controls">
    <button id="playBtn" aria-label="play" title="space = play/pause · ←/→ = frame step · ↑/↓ = prev/next event">▶</button>
    <button class="stepbtn" id="prevEv" aria-label="previous event">|◀</button>
    <button class="stepbtn" id="nextEv" aria-label="next event">▶|</button>
    <div id="timeline"><div id="tlSegs"></div><div id="tlTrack"></div><div id="tlPlay"></div><div id="tlTicks"></div></div>
    <span id="timeRead">0.00 / 0.00 s</span>
    <select id="speed"><option value="1">×1</option><option value="0.5">×0.5</option><option value="0.25">×0.25</option></select>
    <label class="chk on" id="ckPause"><span class="box">✓</span>Pause on events</label>
    <label class="chk" id="ckFull"><span class="box"></span>Full calculation</label>
  </div>
</div>
<div id="side">
  <div id="chartBlock"><div id="chartHead"><h3>Height vs time after takeoff</h3><span class="u">m / s</span></div><div id="legendRow"></div><svg id="chart" role="img"></svg><div id="chartEmpty" style="display:none">waiting for takeoff</div></div>
  <div id="sideInner">
  <div id="steps"></div>
  <div id="howmade"></div>
</div></div>
</main>
<script id="result-data" type="application/json">/*__PP_RESULT_JSON__*/null</script>
<script id="summary-data" type="application/json">/*__PP_SUMMARY_JSON__*/null</script>
<script id="page-flags" type="application/json">/*__PP_FLAGS_JSON__*/null</script>
<script>
"use strict";
const R=JSON.parse(document.getElementById("result-data").textContent||"null");
const SUM=JSON.parse(document.getElementById("summary-data").textContent||"null");
const FLAGS=JSON.parse(document.getElementById("page-flags").textContent||"{}");
const $=id=>document.getElementById(id);
const VID=(R&&R.video)||{coded_width:352,coded_height:240,sample_aspect:{num:1,den:1},measured_fps:30,frame_count:1,duration_s:1};
const FPS=VID.measured_fps||30, NF=VID.frame_count||1;
const SAR=(VID.sample_aspect&&VID.sample_aspect.den?VID.sample_aspect.num/VID.sample_aspect.den:1);
const DW=VID.coded_width*SAR, DH=VID.coded_height;
const WORLD_C={Moon:"#FFB54D",Earth:"#8A8FFF",Mars:"#FF7A4D"};
/* cut-out composites (20.1, 25.2): colour+alpha inlined as data URLs by
   the build (file:// canvases stay origin-clean), composited once here */

$("speed").addEventListener("change",e=>{vid.playbackRate=parseFloat(e.target.value);});
$("ckPause").addEventListener("click",()=>$("ckPause").classList.toggle("on"));
$("ckFull").addEventListener("click",()=>{S.full=!S.full;$("ckFull").classList.toggle("on",S.full);buildRail();buildIntro();revealUpTo(S.frame);if(S.hold){if(S.hold.kind==="verdict")showVerdictAll();else document.querySelectorAll("#steps .step.open .ln").forEach(l=>l.classList.add("shown"));}});
/* timeline (4,27): labelled ranges per motion + point events in lanes */
function buildTimeline(){
  const segs=$("tlSegs"),tk=$("tlTicks"),tl=$("timeline");segs.innerHTML="";tk.innerHTML="";
  const mots=((R.first_look||{}).motions||[]);
  const items=mots.length?mots:(R.segments||[]).map(s=>({frame_start:(s.frames||{}).start,frame_end:(s.frames||{}).end,description:(s.label||"segment"),segment_id:s.id}));
  /* (39, 40) a timeline bar names its motion: an unmeasured motion
     shows its description, never only "not measured". The clock's rate
     goes on one bar only: the motion bar whose frames overlap the
     clock calculation step's frames. With no such step, no bar shows
     a rate. */
  const clkStep=(R.calculation_steps||[]).find(s=>s.id==="clock");
  const clkRange=(clkStep&&clkStep.frame!=null)
    ?{a:clkStep.frame,b:(clkStep.frame_end==null?clkStep.frame:clkStep.frame_end)}:null;
  const clk=(R.clock&&R.clock.measured_rate_hz&&clkRange)?`${R.clock.interpretation==="stride"?"stride":"step"} rate ${Number(R.clock.measured_rate_hz).toFixed(1)} Hz`:"";
  /* (43.6) a measured segment is labelled "Jump 1", "Jump 2"
     (the motion kind and its index); an unmeasured segment has no
     label. No label is longer than 12 characters. The clock's rate
     (39, 40) rides in the overlapping bar's tooltip: a 16-character
     rate string can never satisfy the 12-character label rule. */
  const measured=items.filter(m=>m.segment_id);
  let clkBar=-1;
  if(clk)for(let i=0;i<items.length;i++){const m=items[i];
    if(m.frame_start<=clkRange.b&&m.frame_end>=clkRange.a){clkBar=i;break;}}
  const shortLb=s=>{s=String(s||"");return s.length>12?s.slice(0,12):s;};
  for(let i=0;i<items.length;i++){
    const m=items[i];
    const d=document.createElement("div");d.className="tlseg"+(m.segment_id?"":" grey");
    d.style.left=(100*m.frame_start/NF)+"%";d.style.width=(100*Math.max(1,m.frame_end-m.frame_start)/NF)+"%";
    let lb="";
    if(m.segment_id)lb="Jump "+(measured.indexOf(m)+1);
    if(lb.length>12)lb=lb.slice(0,12);
    d.innerHTML=lb?`<span>${escapeHtml(lb)}</span>`:"";
    /* (43.6) a labelled bar is at least as wide as its label, so
       "Jump 1" reads whole on a short jump; the bar's left edge
       (its start frame) never moves. */
    if(lb)d.style.minWidth="36px";
    let tip=m.segment_id?(m.description||lb):((m.description||"")+" — "+(m.skip_reason||""));
    if(i===clkBar)tip+=(tip?" · ":"")+clk;
    d.title=tip;
    segs.appendChild(d);
  }
  const pts=EVENTS.filter(e=>e.kind!=="takeoff"&&e.kind!=="apex"&&e.kind!=="landing");
  for(const e of pts){
    const x=100*e.frame/Math.max(1,NF);
    const d=document.createElement("div");d.className="tltick";d.style.left=x+"%";
    /* (47.4) a range event's timeline tick reads "Size check", never
       the reference name cut at 12 characters. */
    const tickLb=e.kind==="range"?"Size check":shortLb(e.t);
    d.innerHTML=`<span class="tlbl">${escapeHtml(tickLb)}</span>`;d.title=e.kind==="range"?"Size check":e.t;tk.appendChild(d);
  }
  layoutTimelineLabels();
}
/* timeline labels (4, 35): lanes measured after layout, above for
   ranges and below for point events, so labels never crowd, overlap
   or clip at any width. Re-run after layout changes. */
function layoutTimelineLabels(){
  const tl=$("timeline");if(!tl)return;
  tl.classList.remove("tall","pt2");
  const W=tl.clientWidth||300;
  const lanesOf=(els,centreX)=>{
    const lanes=[];
    for(const e of els){
      const w=e.offsetWidth||60;
      const cx=Math.max(0,Math.min(W-w,centreX(e)-w/2));
      let lane=0;
      for(;lane<lanes.length;lane++){
        if(!lanes[lane].some(b=>!(cx+w+3<b.x||b.x+b.w+3<cx)))break;
      }
      if(lane===lanes.length)lanes.push([]);
      lanes[lane].push({x:cx,w:w});
      e._lane=lane;e._cx=cx;
    }
    return lanes;
  };
  /* (40) each motion label is clipped to its own bar (CSS ellipsis,
     full name in the tooltip), so rows are assigned by bar overlap:
     two labels share a row only when their bars are disjoint.
     (43.6) only labelled bars take a lane; unlabelled bars need no
     room. Extra lanes shift the bar row down inside the timeline so
     every label stays inside the control bar. */
  const bars=[...tl.querySelectorAll(".tlseg")].filter(d=>d.firstChild);
  const above=[];
  for(const d of bars){
    const L=parseFloat(d.style.left)/100*W;
    const rendered=d.getBoundingClientRect();
    const Wd=rendered.width>1?rendered.width:parseFloat(d.style.width)/100*W;
    let lane=0;
    for(;lane<above.length;lane++){
      if(!above[lane].some(b=>!(L+Wd+3<b.x||b.x+b.w+3<L)))break;
    }
    if(lane===above.length)above.push([]);
    above[lane].push({x:L,w:Wd});
    const s=d.firstChild;
    if(s){s.classList.remove("lane1","lane2");s.style.left="";s.style.bottom=(8+lane*18)+"px";}
  }
  const shift=(Math.max(1,above.length)-1)*18;
  for(const d of tl.querySelectorAll(".tlseg"))d.style.top=(22+shift)+"px";
  for(const id of ["tlTrack","tlPlay"]) {const e=$(id);if(e)e.style.top=(30+shift)+"px";}
  for(const d of tl.querySelectorAll(".tltick"))d.style.top=(30+shift)+"px";
  /* (40) point-event labels are measured at their real text width and
     laned so Scale/Verdict-style neighbours sit on separate rows. */
  const lbs=[...tl.querySelectorAll(".tltick .tlbl")];
  lbs.forEach(lb=>{lb.classList.remove("lane1","lane2");lb.style.left="";lb.style.transform="";});
  const below=lanesOf(lbs,lb=>parseFloat(lb.parentElement.style.left)/100*W);
  lbs.forEach(lb=>{
    const x=parseFloat(lb.parentElement.style.left)/100*W;
    lb.style.transform="none";
    lb.style.left=(lb._cx-x)+"px";
    lb.style.top=(10+lb._lane*17)+"px";
  });
  tl.classList.remove("tall","pt2");tl.style.paddingTop="";
  tl.style.height=(56+shift+(Math.max(1,below.length)-1)*17)+"px";
}
/* phone cards below the video, never over it (35.2): the verdict
   card and the scale reference card move into the slot; the stage
   keeps only HUD, badge, rulers, ghosts, caption and trajectories */
function placeVerdict(){
  const slot=$("phoneSlot"),st=$("stage");
  if(!slot||!st)return;
  const phone=window.matchMedia&&window.matchMedia("(max-width: 700px)").matches;
  for(const id of ["verdict","refcard"]){
    const v=$(id);if(!v)continue;
    if(phone){v.classList.add("below");if(v.parentElement!==slot)slot.appendChild(v);}
    else{v.classList.remove("below");if(v.parentElement!==st)st.appendChild(v);}
  }
}
/* ---------- boot ---------- */
function boot(){
  buildIntro();buildRail();buildTimeline();placeVerdict();bindTimeline();
  if(!(R.segments||[]).length){$("chartBlock").style.display="none";}
  /* (47.3) over HTTP(S) (GitHub Pages) the player fetches the whole
     clip once, as a blob, and plays it from an object URL. On file://
     it uses the file directly. */
  if(FLAGS.has_video){
    if(location.protocol.indexOf("http")===0){
      fetch("clip.mp4").then(r=>{if(!r.ok)throw new Error("clip "+r.status);return r.blob();}).then(b=>{vid.src=URL.createObjectURL(b);}).catch(()=>{vid.src="clip.mp4";});
    }else vid.src="clip.mp4";
  }
  else{vid.style.display="none";freeze.style.display="none";if(FLAGS.poster){const pi=$("posterImg");pi.src=FLAGS.poster;pi.style.display="block";}}
  /* (47.3) the ride starts only when the video can play through. */
  S.videoReady=false;
  vid.addEventListener("canplaythrough",()=>{S.videoReady=true;if(S.pendingStart){playFromStart();}});
  vid.addEventListener("loadedmetadata",()=>{fitStage();drawFreeze();applyCam();});
  // 46.1: while the video plays the freeze canvas is hidden and the
  // viewer sees the live video; when it pauses the canvas is drawn and
  // shown. seeked redraws it as before (16).
  vid.addEventListener("playing",()=>{syncFreezeVis();});
  vid.addEventListener("pause",()=>{drawFreeze();});
  vid.addEventListener("seeked",()=>{drawFreeze();});
  fitStage();
  const q=new URLSearchParams(location.search);
  if(q.has("frame")){S.started=true;seekTo(parseInt(q.get("frame"),10)||0,true);}
  else if(q.has("event")){const ev=EVENTS.find(e=>e.id===q.get("event")||e.kind===q.get("event"));S.started=true;if(ev){seekFrame(ev.frame);enterHold(ev,true);}renderStage();applyCam();}
  else{renderStage();applyCam();}
  if(q.get("autoplay")==="1")togglePlay();
  preloadCutouts().then(()=>{renderStage();applyCam();});
  lastT=performance.now();rafId=requestAnimationFrame(tick);
}
document.addEventListener("DOMContentLoaded",boot);
</script>
