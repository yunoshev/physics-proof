[project]
name = "physics-proof"
version = "0.1.0"
description = "Video in, proof out: check a clip's physics with Meta models (Muse Spark 1.3, SAM 3.1)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "meta-sam-parser>=0.0.6",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physics_proof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api: calls the real Meta API (opt-in with -m api; spends a fraction of a cent)",
]
