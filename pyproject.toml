# generated from brief/04 · part 04 owns this file
[project]
name = "physics-proof"
version = "0.1.0"
description = "Agent-loop video physics analysis (brief parts 01-15)"
# One Python, 3.13 (part 04 addendum 2026-10-28): a bare `uv run` must
# pick 3.13 too, so the pin is ==, not >=. With >=3.13 an agent's
# `uv run pytest` built .venv on 3.14 and the pinned test command then
# failed on the non-empty directory.
requires-python = "==3.13.*"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    # The only HTTP client in the runtime: src/clients/ talks to the
    # Meta Model API through this, nothing else opens sockets.
    "httpx",
    # Meta's SAM output parser: the only SAM decoder (part 07 forbids a
    # hand-written one). NOTE: custom Meta SAM licence agreement
    # (non-OSI, ships with the package); not MIT/Apache.
    "meta-sam-parser",
]

[dependency-groups]
dev = [
    "pytest",
    # Browser tests run against the installed Google Chrome.
    "playwright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
