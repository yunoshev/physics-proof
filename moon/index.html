@media (max-width:700px){
  /* (42.4) one screen on a phone too: the column goes below the
     control bar and only the column scrolls, never the page */
  main{flex-direction:column;height:100dvh;overflow:hidden}
  #left{flex:none}
  #side{flex:1 1 auto;min-height:0}
  #controls{position:sticky;bottom:0;background:var(--page);flex-wrap:wrap;height:auto;min-height:52px;row-gap:6px}
  header{display:none}
  /* phone: the question lives above the video, never twice (35) */
  #ptitle{display:block;font-size:22px;font-weight:800;color:#EDF3F8;margin:0 0 8px;line-height:1.2}
  /* phone: the timeline gets its own full-width row, never squeezed (35) */

  /* phone: the intro starts below the HUD and scrolls, never cut (35) */
  #intro{padding-top:52px;pointer-events:auto;overflow-y:auto}

     not over it (35) */

  #verdict.below{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:8px 0 0;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere}

     clip inside the viewport instead of widening the document */
  #side{min-width:0;max-width:100%}
  #sideInner{overflow-x:hidden}
  .rbar .dom{overflow-wrap:anywhere}
  #refcard.below{position:relative;width:auto;max-height:none;margin:8px 0 0;
    top:auto;bottom:auto;right:auto;overflow:visible}
  #hud{font-size:10px;max-width:64%;top:8px;left:8px}
  #badge{font-size:9px;top:8px;right:8px}
  #intro h2{font-size:30px}
  #introCards{flex-direction:column}
  #caption .t{font-size:18px}
  .stepbtn{width:28px;height:28px}
  #timeRead{font-size:11px}
  .chk{font-size:10px}
  /* phone: compact card, clipped with … by clampCardText, clear of
     the caption below (35) */
  #refcard{width:56%;max-height:42%;padding:10px;overflow:hidden}
  #verdict{padding:14px}
  #verdict .g{font-size:28px}
}

<header><h1 id="ttl">Player</h1><nav class="tabs" id="tabs"></nav></header>
<main>
<div id="left">
  <div id="ptitle"></div>
  <div id="stage" data-testid="stage">
    <div id="vbox">
      <video id="vid" playsinline preload="auto" muted></video>
      <img id="posterImg" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000">
      <canvas id="freeze"></canvas>
      <div id="vig"></div><div id="dim"></div>
      <div id="stageOverlay" data-testid="stage-overlay"><svg id="ov" preserveAspectRatio="none"></svg></div>
    </div>
    <div id="hud"><span class="dot"></span><span id="hudTx"></span><span class="frz" id="hudFrz" style="display:none"></span></div>
    <div id="badge"></div>
    <div id="caption" style="display:none"><div class="t" id="capT"></div><div class="n" id="capN"></div></div>
    <div id="refcard" style="display:none"></div>
    <div id="verdict" style="display:none"></div>
    <div id="holdbar"></div><div id="flash"></div>
    <div id="intro"></div>
  </div>
  <div id="phoneSlot"></div>
  <div id="controls">
    <button id="playBtn" aria-label="play" title="space = play/pause · ←/→ = frame step · ↑/↓ = prev/next event">▶</button>
    <button class="stepbtn" id="prevEv" aria-label="previous event">|◀</button>
    <button class="stepbtn" id="nextEv" aria-label="next event">▶|</button>
    <div id="timeline"><div id="tlSegs"></div><div id="tlTrack"></div><div id="tlPlay"></div><div id="tlTicks"></div></div>
    <span id="timeRead">0.00 / 0.00 s</span>
    <select id="speed"><option value="1">×1</option><option value="0.5">×0.5</option><option value="0.25">×0.25</option></select>
    <label class="chk on" id="ckPause"><span class="box">✓</span>Pause on events</label>
    <label class="chk" id="ckFull"><span class="box"></span>Full calculation</label>
  </div>
</div>
<div id="side">
  <div id="chartBlock"><div id="chartHead"><h3>Height vs time after takeoff</h3><span class="u">m / s</span></div><div id="legendRow"></div><svg id="chart" role="img"></svg><div id="chartEmpty" style="display:none">waiting for takeoff</div></div>
  <div id="sideInner">
  <div id="steps"></div>
  <div id="howmade"></div>

  /* (43.6) a measured segment is labelled "Jump 1", "Jump 2"
     (the motion kind and its index); an unmeasured segment has no
     label. No label is longer than 12 characters. The clock's rate
     (39, 40) rides in the overlapping bar's tooltip: a 16-character
     rate string can never satisfy the 12-character label rule. */
  const measured=items.filter(m=>m.segment_id);
  let clkBar=-1;
  if(clk)for(let i=0;i<items.length;i++){const m=items[i];
    if(m.frame_start<=clkRange.b&&m.frame_end>=clkRange.a){clkBar=i;break;}}
  const shortLb=s=>{s=String(s||"");return s.length>12?s.slice(0,12):s;};
  for(let i=0;i<items.length;i++){
    const m=items[i];
    const d=document.createElement("div");d.className="tlseg"+(m.segment_id?"":" grey");
    d.style.left=(100*m.frame_start/NF)+"%";d.style.width=(100*Math.max(1,m.frame_end-m.frame_start)/NF)+"%";
    let lb="";
    if(m.segment_id)lb="Jump "+(measured.indexOf(m)+1);
    if(lb.length>12)lb=lb.slice(0,12);
    d.innerHTML=lb?`<span>${escapeHtml(lb)}</span>`:"";
    /* (43.6) a labelled bar is at least as wide as its label, so
       "Jump 1" reads whole on a short jump; the bar's left edge
       (its start frame) never moves. */
    if(lb)d.style.minWidth="36px";
    let tip=m.segment_id?(m.description||lb):((m.description||"")+" — "+(m.skip_reason||""));
    if(i===clkBar)tip+=(tip?" · ":"")+clk;
    d.title=tip;
    segs.appendChild(d);
  }
  const pts=EVENTS.filter(e=>e.kind!=="takeoff"&&e.kind!=="apex"&&e.kind!=="landing");
  for(const e of pts){
    const x=100*e.frame/Math.max(1,NF);
    const d=document.createElement("div");d.className="tltick";d.style.left=x+"%";
    /* (47.4) a range event's timeline tick reads "Size check", never
       the reference name cut at 12 characters. */
    const tickLb=e.kind==="range"?"Size check":shortLb(e.t);
    d.innerHTML=`<span class="tlbl">${escapeHtml(tickLb)}</span>`;d.title=e.kind==="range"?"Size check":e.t;tk.appendChild(d);
  }
  layoutTimelineLabels();
}
/* timeline labels (4, 35): lanes measured after layout, above for
   ranges and below for point events, so labels never crowd, overlap
   or clip at any width. Re-run after layout changes. */
function layoutTimelineLabels(){
  const tl=$("timeline");if(!tl)return;
  tl.classList.remove("tall","pt2");
  const W=tl.clientWidth||300;
  const lanesOf=(els,centreX)=>{
    const lanes=[];
    for(const e of els){
      const w=e.offsetWidth||60;
      const cx=Math.max(0,Math.min(W-w,centreX(e)-w/2));
      let lane=0;
      for(;lane<lanes.length;lane++){
        if(!lanes[lane].some(b=>!(cx+w+3<b.x||b.x+b.w+3<cx)))break;
      }
      if(lane===lanes.length)lanes.push([]);
      lanes[lane].push({x:cx,w:w});
      e._lane=lane;e._cx=cx;
    }
    return lanes;
  };
  /* (40) each motion label is clipped to its own bar (CSS ellipsis,
     full name in the tooltip), so rows are assigned by bar overlap:
     two labels share a row only when their bars are disjoint.
     (43.6) only labelled bars take a lane; unlabelled bars need no
     room. Extra lanes shift the bar row down inside the timeline so
     every label stays inside the control bar. */
  const bars=[...tl.querySelectorAll(".tlseg")].filter(d=>d.firstChild);
  const above=[];
  for(const d of bars){
    const L=parseFloat(d.style.left)/100*W;
    const rendered=d.getBoundingClientRect();
    const Wd=rendered.width>1?rendered.width:parseFloat(d.style.width)/100*W;
    let lane=0;
    for(;lane<above.length;lane++){
      if(!above[lane].some(b=>!(L+Wd+3<b.x||b.x+b.w+3<L)))break;
    }
    if(lane===above.length)above.push([]);
    above[lane].push({x:L,w:Wd});
    const s=d.firstChild;
    if(s){s.classList.remove("lane1","lane2");s.style.left="";s.style.bottom=(8+lane*18)+"px";}
  }
  const shift=(Math.max(1,above.length)-1)*18;
  for(const d of tl.querySelectorAll(".tlseg"))d.style.top=(22+shift)+"px";
  for(const id of ["tlTrack","tlPlay"]) {const e=$(id);if(e)e.style.top=(30+shift)+"px";}
  for(const d of tl.querySelectorAll(".tltick"))d.style.top=(30+shift)+"px";
  /* (40) point-event labels are measured at their real text width and
     laned so Scale/Verdict-style neighbours sit on separate rows. */
  const lbs=[...tl.querySelectorAll(".tltick .tlbl")];
  lbs.forEach(lb=>{lb.classList.remove("lane1","lane2");lb.style.left="";lb.style.transform="";});
  const below=lanesOf(lbs,lb=>parseFloat(lb.parentElement.style.left)/100*W);
  lbs.forEach(lb=>{
    const x=parseFloat(lb.parentElement.style.left)/100*W;
    lb.style.transform="none";
    lb.style.left=(lb._cx-x)+"px";
    lb.style.top=(10+lb._lane*17)+"px";
  });
  tl.classList.remove("tall","pt2");tl.style.paddingTop="";
  tl.style.height=(56+shift+(Math.max(1,below.length)-1)*17)+"px";
}
/* phone cards below the video, never over it (35.2): the verdict
   card and the scale reference card move into the slot; the stage
   keeps only HUD, badge, rulers, ghosts, caption and trajectories */
function placeVerdict(){
  const slot=$("phoneSlot"),st=$("stage");
  if(!slot||!st)return;
  const phone=window.matchMedia&&window.matchMedia("(max-width: 700px)").matches;
  for(const id of ["verdict","refcard"]){
    const v=$(id);if(!v)continue;
    if(phone){v.classList.add("below");if(v.parentElement!==slot)slot.appendChild(v);}
    else{v.classList.remove("below");if(v.parentElement!==st)st.appendChild(v);}
  }
}
/* ---------- boot ---------- */
function boot(){
  buildIntro();buildRail();buildTimeline();placeVerdict();bindTimeline();
  if(!(R.segments||[]).length){$("chartBlock").style.display="none";}
  /* (47.3) over HTTP(S) (GitHub Pages) the player fetches the whole
     clip once, as a blob, and plays it from an object URL. On file://
     it uses the file directly. */
  if(FLAGS.has_video){
    if(location.protocol.indexOf("http")===0){
      fetch("clip.mp4").then(r=>{if(!r.ok)throw new Error("clip "+r.status);return r.blob();}).then(b=>{vid.src=URL.createObjectURL(b);}).catch(()=>{vid.src="clip.mp4";});
    }else vid.src="clip.mp4";
  }
  else{vid.style.display="none";freeze.style.display="none";if(FLAGS.poster){const pi=$("posterImg");pi.src=FLAGS.poster;pi.style.display="block";}}
  /* (47.3) the ride starts only when the video can play through. */
  S.videoReady=false;
  vid.addEventListener("canplaythrough",()=>{S.videoReady=true;if(S.pendingStart){playFromStart();}});
  vid.addEventListener("loadedmetadata",()=>{fitStage();drawFreeze();applyCam();});
  // 46.1: while the video plays the freeze canvas is hidden and the
  // viewer sees the live video; when it pauses the canvas is drawn and
  // shown. seeked redraws it as before (16).
  vid.addEventListener("playing",()=>{syncFreezeVis();});
  vid.addEventListener("pause",()=>{drawFreeze();});
  vid.addEventListener("seeked",()=>{drawFreeze();});
  fitStage();
  const q=new URLSearchParams(location.search);
  if(q.has("frame")){S.started=true;seekTo(parseInt(q.get("frame"),10)||0,true);}
  else if(q.has("event")){const ev=EVENTS.find(e=>e.id===q.get("event")||e.kind===q.get("event"));S.started=true;if(ev){seekFrame(ev.frame);enterHold(ev,true);}renderStage();applyCam();}
  else{renderStage();applyCam();}
  if(q.get("autoplay")==="1")togglePlay();
  preloadCutouts().then(()=>{renderStage();applyCam();});
  lastT=performance.now();rafId=requestAnimationFrame(tick);
}
document.addEventListener("DOMContentLoaded",boot);
</script>
