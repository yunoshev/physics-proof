@media (max-width:700px){
  /* (42.4) one screen on a phone too: the column goes below the
     control bar and only the column scrolls, never the page */
  main{flex-direction:column;height:100dvh;overflow:hidden}
  #left{flex:none}
  #side{flex:1 1 auto;min-height:0}
  #controls{position:sticky;bottom:0;background:var(--page);flex-wrap:wrap;height:auto;min-height:52px;row-gap:6px}
  header{display:none}
  /* phone: the question lives above the video, never twice (35) */
  #ptitle{display:block;font-size:22px;font-weight:800;color:#EDF3F8;margin:0 0 8px;line-height:1.2}
  /* phone: the timeline gets its own full-width row, never squeezed (35) */

  /* phone: the intro starts below the HUD and scrolls, never cut (35) */
  #intro{padding-top:52px;pointer-events:auto;overflow-y:auto}

     not over it (35) */

  #verdict.below{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:8px 0 0;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere}

     clip inside the viewport instead of widening the document */
  #side{min-width:0;max-width:100%}
  #sideInner{overflow-x:hidden}
  .rbar .dom{overflow-wrap:anywhere}
  #refcard.below{position:relative;width:auto;max-height:none;margin:8px 0 0;
    top:auto;bottom:auto;right:auto;overflow:visible}
  #hud{font-size:10px;max-width:64%;top:8px;left:8px}
  #badge{font-size:9px;top:8px;right:8px}
  #intro h2{font-size:30px}
  #introCards{flex-direction:column}
  #caption .t{font-size:18px}
  .stepbtn{width:28px;height:28px}
  #timeRead{font-size:11px}
  .chk{font-size:10px}
  /* phone: compact card, clipped with … by clampCardText, clear of
     the caption below (35) */
  #refcard{width:56%;max-height:42%;padding:10px;overflow:hidden}
  #verdict{padding:14px}
  #verdict .g{font-size:28px}
}

<header><h1 id="ttl">Player</h1><nav class="tabs" id="tabs"></nav></header>
<main>
<div id="left">
  <div id="ptitle"></div>
  <div id="stage" data-testid="stage">
    <div id="vbox">
      <video id="vid" playsinline preload="auto" muted></video>
      <img id="posterImg" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000">
      <canvas id="freeze"></canvas>
      <div id="vig"></div><div id="dim"></div>
      <div id="stageOverlay" data-testid="stage-overlay"><svg id="ov" preserveAspectRatio="none"></svg></div>
    </div>
    <div id="hud"><span class="dot"></span><span id="hudTx"></span><span class="frz" id="hudFrz" style="display:none"></span></div>
    <div id="badge"></div>
    <div id="caption" style="display:none"><div class="t" id="capT"></div><div class="n" id="capN"></div></div>
    <div id="refcard" style="display:none"></div>
    <div id="verdict" style="display:none"></div>
    <div id="holdbar"></div><div id="flash"></div>
    <div id="intro"></div>
  </div>
  <div id="phoneSlot"></div>
  <div id="controls">
    <button id="playBtn" aria-label="play" title="space = play/pause · ←/→ = frame step · ↑/↓ = prev/next event">▶</button>
    <button class="stepbtn" id="prevEv" aria-label="previous event">|◀</button>
    <button class="stepbtn" id="nextEv" aria-label="next event">▶|</button>
    <div id="timeline"><div id="tlSegs"></div><div id="tlTrack"></div><div id="tlPlay"></div><div id="tlTicks"></div></div>
    <span id="timeRead">0.00 / 0.00 s</span>
    <select id="speed"><option value="1">×1</option><option value="0.5">×0.5</option><option value="0.25">×0.25</option></select>
    <label class="chk on" id="ckPause"><span class="box">✓</span>Pause on events</label>
    <label class="chk" id="ckFull"><span class="box"></span>Full calculation</label>
  </div>
</div>
<div id="side">
  <div id="chartBlock"><div id="chartHead"><h3>Height vs time after takeoff</h3><span class="u">m / s</span></div><div id="legendRow"></div><svg id="chart" role="img"></svg><div id="chartEmpty" style="display:none">waiting for takeoff</div></div>
  <div id="sideInner">
  <div id="steps"></div>
  <div id="howmade"></div>

<script>
"use strict";
const R=JSON.parse(document.getElementById("result-data").textContent||"null");

const FLAGS=JSON.parse(document.getElementById("page-flags").textContent||"{}");
const $=id=>document.getElementById(id);
const VID=(R&&R.video)||{coded_width:352,coded_height:240,sample_aspect:{num:1,den:1},measured_fps:30,frame_count:1,duration_s:1};
const FPS=VID.measured_fps||30, NF=VID.frame_count||1;
const SAR=(VID.sample_aspect&&VID.sample_aspect.den?VID.sample_aspect.num/VID.sample_aspect.den:1);

/* cut-out composites (20.1, 25.2): colour+alpha inlined as data URLs by

const CUTURL=new Map();let cutsReady=false;
function ghostWorlds(){const s=new Set();for(const sg of (R.segments||[]))for(const g of (sg.ghosts||[]))s.add(g.world);return[...s];}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("img"));i.src=src;});}
function tintCanvas(base,world){const w=base.width,h=base.height;const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.filter="grayscale(1) brightness(1.15)";x.drawImage(base,0,0);x.filter="none";x.globalCompositeOperation="source-atop";x.globalAlpha=0.38;x.fillStyle=WORLD_C[world]||"#FFF";x.fillRect(0,0,w,h);x.globalAlpha=1;return c;}
async function preloadCutouts(){
  const jobs=[];
  for(const sg of (R.segments||[])){
    for(const c of ((FLAGS.cutouts||{})[sg.id]||[])){
      if(!c.data||!c.adata)continue;
      jobs.push((async()=>{try{
        const[col,alp]=await Promise.all([loadImg(c.data),loadImg(c.adata)]);
        const base=document.createElement("canvas");base.width=col.naturalWidth;base.height=col.naturalHeight;
        const b=base.getContext("2d");b.drawImage(col,0,0);b.globalCompositeOperation="destination-in";b.drawImage(alp,0,0,base.width,base.height);b.globalCompositeOperation="source-over";
        CUTURL.set(sg.id+":"+c.frame+":neutral",base.toDataURL("image/png"));
        for(const w of ghostWorlds())CUTURL.set(sg.id+":"+c.frame+":"+w,tintCanvas(base,w).toDataURL("image/png"));
      }catch(e){}})());
    }

function cutFor(seg,fr){const cut=(FLAGS.cutouts||{})[seg.id]||[];if(!cut.length)return null;let best=cut[0];for(const c of cut)if(Math.abs(c.frame-fr)<Math.abs(best.frame-fr))best=c;return best;}
/* ---------- the one rounding function (part 13 section 13) ---------- */
function fmtVal(v,sig){if(v==null||!isFinite(v))return"–";if(sig==null||!isFinite(sig)||sig===0){return fmtSig(v,3);}const d=Math.max(0,-Math.floor(Math.log10(Math.abs(sig)))+1);if(!isFinite(d))return fmtSig(v,3);return Number(v).toFixed(Math.min(d,10));}
function fmtSig(v,n){if(v==null||!isFinite(v))return"–";if(v===0)return"0";n=n||3;const e=Math.floor(Math.log10(Math.abs(v)));const f=n-1-e;if(f>=0)return Number(v).toFixed(Math.min(f,10));const p=Math.pow(10,-f);return String(Math.round(Number(v)/p)*p);}
function fmtInt(v){return String(Math.round(v));}
function fmtPct(v){return Number(v).toFixed(1)+"%";}
function fmtS(v,sig){if(v==null)return"–";const d=sig!=null&&isFinite(sig)?Math.max(0,-Math.floor(Math.log10(Math.abs(sig)))+1):2;return Number(v).toFixed(Math.min(d,10))+" s";}
function fmtM(v,sig){return fmtVal(v,sig)+" m";}
function fmtG(v,sig){return fmtVal(v,sig)+" m/s²";}
function fmtSigmaMult(d){return (Math.round(Number(d)*10)/10).toFixed(1)+"σ";}
function fmtFactor(f){return "×"+(Math.round(Number(f)*100)/100);}
/* pass over rendered text: latex->unicode, stray precision (17.7, 32).
   Never touches data blocks: script/style skipped by the walker. */
function roundVisible(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){
    const el=n.parentElement;
    if(!n.nodeValue||!n.nodeValue.trim())continue;
    if(!el||el.closest("script,style"))continue;
    if(el.closest(".katex-mathml"))continue;
    let u=n.nodeValue;
    const t0=u;
    u=u.replace(/\^2/g,"²").replace(/(?<![A-Za-z])sigma(?![A-Za-z])/g,"σ");
    u=u.replace(/(\d+\.\d+)σ/g,(m,g)=>fmtSigmaMult(parseFloat(g)));
    u=u.replace(/(\d+\.\d{3,})(\s*s\b)/g,(m,g,s)=>parseFloat(g).toFixed(2)+s);

function roundAll(){
  for(const id of ["stage","sideInner","timeline","timeRead","controls","ptitle","ttl"])
    {const e=$(id);if(e)roundVisible(e);}

/* ---------- events ---------- */
function segOf(id){return (R.segments||[]).find(s=>s.id===id);}
function buildEvents(){
  const ev=[];
  if(R.scale&&R.scale.frame!=null)ev.push({id:"scale",kind:"scale",frame:R.scale.frame,t:"Scale",dur:3.8,zoom:1.30});
  for(const rc of (R.range_checks||[]))ev.push({id:"range_"+rc.id,kind:"range",frame:rc.frame,t:rc.label||"Range",dur:2.0,zoom:1.30,rc});
  const segs=R.segments||[];
  for(const sg of segs){const F=sg.frames||{};
    if(F.start!=null)ev.push({id:"takeoff_"+sg.id,kind:"takeoff",frame:F.start,t:"Takeoff",dur:1.5,zoom:1.20,seg:sg.id});
    if(F.apex!=null)ev.push({id:"apex_"+sg.id,kind:"apex",frame:F.apex,t:"Apex",dur:2.8,zoom:1.20,seg:sg.id});
    if(F.end!=null)ev.push({id:"landing_"+sg.id,kind:"landing",frame:F.end,t:"Landing",dur:5.6,zoom:1.03,seg:sg.id});
  }
  /* (42.3) the verdict hold starts only when the video reaches its
     last frame, never earlier; the ride only moves forward. */
  ev.push({id:"verdict",kind:"verdict",frame:NF-1,t:"Verdict",dur:0,zoom:1.03,sticky:true});
  ev.sort((a,b)=>a.frame-b.frame);

const EVENTS=buildEvents();
const GROUP={mask_check:"scale",scale:"takeoff",segment:"takeoff",fit:"apex",time_from_frames:"landing",measured_g:"verdict",clock:"verdict",uncertainty:"verdict",verdict:"verdict"};
function stepEvent(st){
  if(st._um)return"unmeas";
  if(st._rc||st.id.startsWith("range_"))return"range";
  if(GROUP[st.id])return GROUP[st.id];
  if(st.frame==null)return"verdict";
  let best="scale",bd=1e12;for(const e of EVENTS){const d=Math.abs(e.frame-st.frame);if(d<bd){bd=d;best=e.kind;}}
  if(best.startsWith("takeoff"))return"takeoff";
  if(best.startsWith("apex"))return"apex";
  if(best.startsWith("landing"))return"landing";
  if(["scale","verdict","range"].includes(best))return best;
  return"verdict";
}
function verdictFrame(){const e=EVENTS[EVENTS.length-1];return e?e.frame:1e12;}
function stepSortKey(st){
  const ev=stepEvent(st);
  if(ev==="verdict")return verdictFrame()+1;
  if(ev==="range"||ev==="unmeas")return st.frame==null?1e12:st.frame;
  let best=null,bd=1e18;
  for(const e of EVENTS){if(e.kind!==ev)continue;const d=Math.abs((st.frame==null?e.frame:st.frame)-e.frame);if(d<bd){bd=d;best=e;}}
  return best?best.frame:1e12;

/* ---------- state ---------- */
const S={frame:0,playing:false,hold:null,holdQueue:[],holdT:0,cam:{x:DW/2,y:DH/2,z:1.03},camT:{x:DW/2,y:DH/2,z:1.03},camFit:1.03,started:false,scaleDone:false,prevFrame:0,full:false,ended:false,seen:[],fired:[],clock:0,cutsReady:false,renderKey:""};
window.__pp={frame:()=>S.frame,hold:()=>S.hold?{kind:S.hold.kind,t:S.holdT,dur:S.hold.dur}:null,camera:()=>({...S.cam}),events:()=>EVENTS.map(e=>e.id),cutsReady:()=>!!S.cutsReady,seen:()=>S.seen.slice(),fired:()=>S.fired.slice(),videoReady:()=>!!S.videoReady,pendingStart:()=>!!S.pendingStart};
/* ---------- video + virtual camera (18.2, 22.1, 29, 30) ---------- */
const vid=$("vid"),stage=$("stage"),vbox=$("vbox"),ov=$("ov"),freeze=$("freeze"),fctx=freeze.getContext("2d");
function fitStage(){
  /* (42.4) the stage keeps the video's display aspect (coded size ×
     SAR); its height is min(free height, free width / aspect), so a
     portrait clip gives a tall, narrow, centred stage with the side
     column beside it. vbox fills the stage exactly: one video box for
     every stage layer (29). */

  const availW=Math.max(50,left.clientWidth);
  const pt=$("ptitle");

  const ctrlH=controls?controls.offsetHeight:52;
  let availH=Math.max(50,mainEl.clientHeight-ctrlH-ptH-14);
  if(window.matchMedia&&window.matchMedia("(max-width: 700px)").matches)
    availH=Math.max(50,availH-120);

  let w=availW,h=w/ar;
  if(h>availH){h=availH;w=h*ar;}

  stage.style.height=Math.max(2,Math.floor(h))+"px";

}

  return q;
}
function enterHold(ev,sticky){
  S.hold=ev;S.holdT=0;
  const ct=camTargetFor(ev);S.camT={x:ct.x,y:ct.y,z:ct.z};S.camFit=ct.z;
  // 44.1: a hold seeks only when it must. Seeks are exact: never
  // fastSeek (Firefox/Safari land on keyframes and the ride loops).
  // When the playhead already sits on the event frame, stay put.
  S.frame=ev.frame;S.prevFrame=ev.frame;S.prevFrame2=ev.frame;S.clock=ev.frame;
  if(FLAGS.has_video){
    const _t=ev.frame/FPS;
    if(Math.abs(vid.currentTime-_t)>0.5/FPS){try{vid.currentTime=_t;}catch(e){}}
  }
  // 44.2: an event fires at most once per ride.
  if(!S.fired.includes(ev.id))S.fired.push(ev.id);
  try{vid.pause();}catch(e){}
  S.seen.push(ev.kind+":"+ev.frame);
  revealUpTo(ev.frame);
  if(sticky){
    document.querySelectorAll("#steps .step.open .ln").forEach(ln=>ln.classList.add("shown"));
    S.lineQueue=[];
    S.cam={x:S.camT.x,y:S.camT.y,z:S.camT.z};
    scrollRailToCurrent();
  }else revealLines(ev);
  if(ev.kind==="verdict")showVerdictAll();
  drawFreeze();
  applyCam();
  const fl=$("flash");fl.style.transition="none";fl.style.opacity=0.16;requestAnimationFrame(()=>{fl.style.transition="opacity .45s";fl.style.opacity=0;});
}
function exitHold(){
  // 44.2: the playhead does not move back by itself. After a hold the
  // video may report a time before the held frame; seek to the held
  // frame again (it is already fired, so nothing re-fires).
  const _h=S.hold;
  S.hold=null;S.holdT=0;S.camT={x:DW/2,y:DH/2,z:1.03};
  $("holdbar").style.width="0";
  const hd=$("chronoHead");if(hd)hd.remove();
  if(S.playing){
    // 34.1: queued crossings fire in order; resume from the exited hold
    if(S.holdQueue&&S.holdQueue.length){const nx=S.holdQueue.shift();enterHold(nx);renderStage();applyCam();return;}
    if(_h&&FLAGS.has_video){
      const _t=_h.frame/FPS;
      if(Math.abs(vid.currentTime-_t)>0.5/FPS){try{vid.currentTime=_t;}catch(e){}}
      S.frame=_h.frame;S.prevFrame=_h.frame;S.prevFrame2=_h.frame;
    }
    try{const p=vid.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
  }
}
function tick(t){
  rafId=requestAnimationFrame(tick);
  const dt=Math.min(1,(t-lastT)/1000||0.016);lastT=t;
  // the timeline re-lanes itself when its width changes (35)
  const _tw=$("timeline").clientWidth;
  if(_tw&&Math.abs(_tw-(S._tlW||0))>2){S._tlW=_tw;layoutTimelineLabels();}
  if(!S.playing||!S.started)return;
  if(S.hold){
    S.holdT+=dt;
    const h=S.hold;$("holdbar").style.width=(100*Math.min(1,S.holdT/h.dur))+"%";
    revealTick(h,dt);
    S.camT.z=Math.min(S.camFit||h.zoom,(h.zoom||1.03)+0.012*Math.min(6,S.holdT),resCap());
    moveCam(dt,3.2);
    if(S.holdT>=h.dur&&h.dur>0){exitHold();}
    maybeRender(h.kind+Math.floor(S.holdT*5));applyCam();return;
  }
  if(!FLAGS.has_video){
    // range-only pages (32): poster mode, the clock is simulated
    S.clock+=dt*FPS;const cur=Math.min(NF-1,Math.floor(S.clock));
    if(cur!==S.frame){S.frame=cur;S.prevFrame=cur;advanceCrossed(cur);revealUpTo(cur);renderStage();}
    applyCam();return;
  }
  const prev=S.prevFrame;
  const cur=frameAtTime();
  // (42.3) the verdict hold starts only when the video reaches its
  // last frame (ended, or the last frame), never earlier. (44.2) it
  // fires at most once per ride, even if the end falls between ticks.
  if(vid.ended||cur>=NF-1){const ve=EVENTS[EVENTS.length-1];if(!S.fired.includes(ve.id)&&(!S.hold||S.hold.kind!=="verdict"))enterHold(ve);S.playing=false;updatePlayBtn();renderStage();applyCam();return;}
  if(cur!==prev){
    if(cur<prev&&(prev-cur)>1){
      // 44.2: the playhead does not move back by itself. A backward
      // report from the element is corrected to the last held frame,
      // never re-fired.
      try{vid.currentTime=prev/FPS;}catch(e){}
      moveCam(dt,4.5);applyCam();return;
    }
    S.frame=cur;
    if($("ckPause").classList.contains("on")){
      // (42.3) every crossed event fires in frame order, except the
      // verdict, which waits for the last frame; the check resumes
      // from the held frame, and the player never rewinds (26.1).
      // (44.2) already-fired events never fire again in this ride.
      const crossed=queueCrossed(prev,cur).filter(e=>e.kind!=="verdict"&&!(e.id==="scale"&&S.scaleDone)&&!S.fired.includes(e.id));
      if(crossed.length){
        // 34.1: every crossed event fires in frame order; the check
        // resumes from the held frame, and the player never rewinds (26.1)
        S.holdQueue=crossed.slice(1);
        const first=crossed[0];
        if(first.id==="scale")S.scaleDone=true;
        enterHold(first);
        renderStage();applyCam();return;
      }
    }
    S.prevFrame=cur;
    revealUpTo(cur);
    renderStage();
  }
  moveCam(dt,4.5);applyCam();
}
function advanceCrossed(cur){
  const prev=S.prevFrame2==null?cur-1:S.prevFrame2;
  S.prevFrame2=cur;
  if(cur>=NF-1){const ve=EVENTS[EVENTS.length-1];if(!S.fired.includes(ve.id)&&(!S.hold||S.hold.kind!=="verdict"))enterHold(ve);S.playing=false;updatePlayBtn();renderStage();applyCam();return;}
  if($("ckPause").classList.contains("on")){
    const crossed=queueCrossed(prev,cur).filter(e=>e.kind!=="verdict"&&!(e.id==="scale"&&S.scaleDone)&&!S.fired.includes(e.id));
    if(crossed.length){
      S.holdQueue=crossed.slice(1);
      const first=crossed[0];
      if(first.id==="scale")S.scaleDone=true;
      enterHold(first);
      renderStage();applyCam();
    }
  }
}
function maybeRender(key){if(S.renderKey!==key){S.renderKey=key;renderStage();}}
function revealLines(ev){
  const steps=[...document.querySelectorAll("#steps .step")].filter(d=>d.dataset.event===ev.kind||(ev.kind==="scale"&&d.dataset.event==="scale"));
  S.lineQueue=[];
  for(const d of steps)for(const ln of d.querySelectorAll(".ln:not(.shown)"))S.lineQueue.push(ln);
  S.lineT=0;
}
function revealTick(h,dt){
  S.lineT=(S.lineT||0)+dt;
  if(S.lineQueue&&S.lineQueue.length&&S.lineT>=0.35){S.lineT=0;const ln=S.lineQueue.shift();ln.classList.add("shown");showNewestLine();}
}
/* (47.1) no fold at the verdict: every step is open with all its
   lines, and the column ends with the Verdict step at the bottom.
   Scrolling up shows every step, each with its calculation. Each
   heading still expands on click. */
function showVerdictAll(){
  document.querySelectorAll("#steps .step").forEach(d=>d.classList.add("open"));
  document.querySelectorAll("#steps .ln").forEach(ln=>ln.classList.add("shown"));
  document.querySelectorAll("#steps .step.cur").forEach(d=>d.classList.remove("cur"));
  const open=[...document.querySelectorAll("#steps .step.open")];
  if(open.length)open[open.length-1].classList.add("cur");
  const rail=$("sideInner");
  if(rail)rail.scrollTo({top:rail.scrollHeight,behavior:"smooth"});
}
/* ---------- transport ---------- */
function seekFrame(f){
  S.frame=Math.max(0,Math.min(NF-1,f));
  S.prevFrame=S.frame;S.prevFrame2=S.frame;
  S.clock=S.frame;
  // 44.1: every seek sets currentTime to the frame's time — never
  // fastSeek (Firefox/Safari land on the nearest keyframe, not the
  // asked time, and the ride loops). The stage draws only after
  // seeked (§16); drawFreeze here is refreshed on seeked too.
  if(FLAGS.has_video){try{vid.currentTime=S.frame/FPS;}catch(e){}}
  // 44.2: an event leaves the fired set when the viewer seeks to a
  // frame before it (timeline, step click, prev/next, arrows).
  S.fired=S.fired.filter(id=>{const e=EVENTS.find(x=>x.id===id);return !!e&&e.frame<=S.frame;});
  // 47.1: a backward seek closes the steps after the new frame.
  closeAfter(S.frame);
  drawFreeze();
}
function seekTo(f,sticky){seekFrame(f);const ev=EVENTS.find(e=>e.frame===f);if(sticky&&ev){S.holdQueue=[];enterHold(ev,true);}revealUpTo(S.frame);if(sticky)scrollRailToCurrent();renderStage();applyCam();}
function updatePlayBtn(){$("playBtn").textContent=S.playing?"❚❚":"▶";}
function playFromStart(){
  // 26.1: the ride is chronological. Play from 0; holds fire in frame
  // order and the player never seeks backwards. Same-frame Scale and
  // Takeoff chain Scale first via the event order (18.1).
  // 44.2: both start buttons (the first-screen button and the round
  // play button) run this same ride from 0, clearing the fired set.
  /* (47.3) the ride starts only when the video can play through. A
     start pressed earlier shows "Loading video…" on the button and
     starts the ride by itself when the video is ready. */
  if(FLAGS.has_video&&!S.videoReady){
    S.pendingStart=true;
    const wb=$("watchBtn");if(wb)wb.textContent="Loading video…";
    return;
  }
  S.pendingStart=false;
  const wb0=$("watchBtn");if(wb0&&wb0.textContent==="Loading video…")wb0.textContent="▶ Watch the analysis";
  S.started=true;S.playing=true;updatePlayBtn();
  try{vid.pause();}catch(e){}
  /* (47.3) no seek at the start when the video already stands at frame
     0 (within half a frame): a seek followed at once by play() stalls
     Firefox for about a second. */
  S.frame=0;S.prevFrame=0;S.prevFrame2=0;S.clock=0;
  if(FLAGS.has_video){try{if(Math.abs(vid.currentTime)>0.5/FPS)vid.currentTime=0;}catch(e){}}
  S.scaleDone=false;S.seen=[];S.fired=[];
  document.querySelectorAll("#steps .step").forEach(d=>d.classList.remove("open"));
  document.querySelectorAll("#steps .ln.shown").forEach(l=>l.classList.remove("shown"));
  drawFreeze();
  try{const p=vid.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
  renderStage();applyCam();
}
function togglePlay(){
  if(!S.started){playFromStart();return;}
  if(S.hold&&S.hold.kind==="verdict"){
    // space after the verdict: ground truth on acceptance pages, else restart
    const rb=$("revealBtn");if(rb&&$("gtBlock")&&$("gtBlock").style.display==="none"){rb.click();return;}
    playFromStart();return;
  }
  /* (42.3) pause pauses: while the video plays it stops and the
     overlays stay; during a timed hold its timer, camera drift, line
     reveal and animations stop where they are, and the next press
     continues the hold from that point. Skipping a hold is only the
     next-event button and ↓. */
  if(S.playing){S.playing=false;try{vid.pause();}catch(e){}}
  else{S.playing=true;if(!S.hold){try{const p=vid.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}}
  updatePlayBtn();
}
/* (42.3) the timeline is a seek bar: click or drag anywhere on it,
   touch included, and the video seeks to that frame and pauses.
   Within 2 frames of an event frame the stage shows that event's
   sticky hold. Later events hold as usual when play continues. */
function tlSeekTo(clientX){
  const r=$("timeline").getBoundingClientRect();
  const frac=Math.max(0,Math.min(1,(clientX-r.left)/Math.max(1,r.width)));
  const f=Math.max(0,Math.min(NF-1,Math.round(frac*(NF-1))));
  S.started=true;S.playing=false;S.holdQueue=[];S.hold=null;
  try{vid.pause();}catch(e){}updatePlayBtn();
  seekFrame(f);
  const ev=EVENTS.find(e=>Math.abs(e.frame-f)<=2);
  if(ev)enterHold(ev,true);
  revealUpTo(S.frame);scrollRailToCurrent();renderStage();applyCam();
}
let tlDrag=false;
function bindTimeline(){
  const tl=$("timeline");
  tl.addEventListener("pointerdown",e=>{tlDrag=true;try{tl.setPointerCapture(e.pointerId);}catch(_){}tlSeekTo(e.clientX);});
  tl.addEventListener("pointermove",e=>{if(tlDrag)tlSeekTo(e.clientX);});
  tl.addEventListener("pointerup",()=>{tlDrag=false;});
  tl.addEventListener("pointercancel",()=>{tlDrag=false;});
}
$("playBtn").addEventListener("click",togglePlay);
document.addEventListener("keydown",e=>{
  /* (42.3) space toggles playback from every state, focus anywhere:
     default-prevented so a focused button does not re-trigger. */
  if(e.key===" "){e.preventDefault();togglePlay();}
  else if(e.key==="ArrowRight"){seekTo(Math.min(NF-1,S.frame+1));}
  else if(e.key==="ArrowLeft"){seekTo(Math.max(0,S.frame-1));}
  else if(e.key==="ArrowUp"){e.preventDefault();stepEventBtn(-1);}
  else if(e.key==="ArrowDown"){e.preventDefault();stepEventBtn(1);}
});
function stepEventBtn(d){const fs=EVENTS.map(e=>e.frame);let t=d>0?fs.find(f=>f>S.frame):[...fs].reverse().find(f=>f<S.frame);if(t==null)t=d>0?fs[fs.length-1]:fs[0];const ev=EVENTS.find(e=>e.frame===t);seekFrame(t);if(ev)enterHold(ev,true);renderStage();applyCam();}
$("prevEv").addEventListener("click",()=>stepEventBtn(-1));
$("nextEv").addEventListener("click",()=>stepEventBtn(1));
$("speed").addEventListener("change",e=>{vid.playbackRate=parseFloat(e.target.value);});
$("ckPause").addEventListener("click",()=>$("ckPause").classList.toggle("on"));
$("ckFull").addEventListener("click",()=>{S.full=!S.full;$("ckFull").classList.toggle("on",S.full);buildRail();buildIntro();revealUpTo(S.frame);if(S.hold){if(S.hold.kind==="verdict")showVerdictAll();else document.querySelectorAll("#steps .step.open .ln").forEach(l=>l.classList.add("shown"));}});
/* timeline (4,27): labelled ranges per motion + point events in lanes */
function buildTimeline(){
  const segs=$("tlSegs"),tk=$("tlTicks"),tl=$("timeline");segs.innerHTML="";tk.innerHTML="";
  const mots=((R.first_look||{}).motions||[]);
  const items=mots.length?mots:(R.segments||[]).map(s=>({frame_start:(s.frames||{}).start,frame_end:(s.frames||{}).end,description:(s.label||"segment"),segment_id:s.id}));
  /* (39, 40) a timeline bar names its motion: an unmeasured motion
     shows its description, never only "not measured". The clock's rate
     goes on one bar only: the motion bar whose frames overlap the
     clock calculation step's frames. With no such step, no bar shows
     a rate. */
  const clkStep=(R.calculation_steps||[]).find(s=>s.id==="clock");
  const clkRange=(clkStep&&clkStep.frame!=null)
    ?{a:clkStep.frame,b:(clkStep.frame_end==null?clkStep.frame:clkStep.frame_end)}:null;
  const clk=(R.clock&&R.clock.measured_rate_hz&&clkRange)?`${R.clock.interpretation==="stride"?"stride":"step"} rate ${Number(R.clock.measured_rate_hz).toFixed(1)} Hz`:"";
  /* (43.6) a measured segment is labelled "Jump 1", "Jump 2"
     (the motion kind and its index); an unmeasured segment has no
     label. No label is longer than 12 characters. The clock's rate
     (39, 40) rides in the overlapping bar's tooltip: a 16-character
     rate string can never satisfy the 12-character label rule. */
  const measured=items.filter(m=>m.segment_id);
  let clkBar=-1;
  if(clk)for(let i=0;i<items.length;i++){const m=items[i];
    if(m.frame_start<=clkRange.b&&m.frame_end>=clkRange.a){clkBar=i;break;}}
  const shortLb=s=>{s=String(s||"");return s.length>12?s.slice(0,12):s;};
  for(let i=0;i<items.length;i++){
    const m=items[i];
    const d=document.createElement("div");d.className="tlseg"+(m.segment_id?"":" grey");
    d.style.left=(100*m.frame_start/NF)+"%";d.style.width=(100*Math.max(1,m.frame_end-m.frame_start)/NF)+"%";
    let lb="";
    if(m.segment_id)lb="Jump "+(measured.indexOf(m)+1);
    if(lb.length>12)lb=lb.slice(0,12);
    d.innerHTML=lb?`<span>${escapeHtml(lb)}</span>`:"";
    /* (43.6) a labelled bar is at least as wide as its label, so
       "Jump 1" reads whole on a short jump; the bar's left edge
       (its start frame) never moves. */
    if(lb)d.style.minWidth="36px";
    let tip=m.segment_id?(m.description||lb):((m.description||"")+" — "+(m.skip_reason||""));
    if(i===clkBar)tip+=(tip?" · ":"")+clk;
    d.title=tip;
    segs.appendChild(d);
  }
  const pts=EVENTS.filter(e=>e.kind!=="takeoff"&&e.kind!=="apex"&&e.kind!=="landing");
  for(const e of pts){
    const x=100*e.frame/Math.max(1,NF);
    const d=document.createElement("div");d.className="tltick";d.style.left=x+"%";
    /* (47.4) a range event's timeline tick reads "Size check", never
       the reference name cut at 12 characters. */
    const tickLb=e.kind==="range"?"Size check":shortLb(e.t);
    d.innerHTML=`<span class="tlbl">${escapeHtml(tickLb)}</span>`;d.title=e.kind==="range"?"Size check":e.t;tk.appendChild(d);
  }
  layoutTimelineLabels();
}
/* timeline labels (4, 35): lanes measured after layout, above for
   ranges and below for point events, so labels never crowd, overlap
   or clip at any width. Re-run after layout changes. */
function layoutTimelineLabels(){
  const tl=$("timeline");if(!tl)return;
  tl.classList.remove("tall","pt2");
  const W=tl.clientWidth||300;
  const lanesOf=(els,centreX)=>{
    const lanes=[];
    for(const e of els){
      const w=e.offsetWidth||60;
      const cx=Math.max(0,Math.min(W-w,centreX(e)-w/2));
      let lane=0;
      for(;lane<lanes.length;lane++){
        if(!lanes[lane].some(b=>!(cx+w+3<b.x||b.x+b.w+3<cx)))break;
      }
      if(lane===lanes.length)lanes.push([]);
      lanes[lane].push({x:cx,w:w});
      e._lane=lane;e._cx=cx;
    }
    return lanes;
  };
  /* (40) each motion label is clipped to its own bar (CSS ellipsis,
     full name in the tooltip), so rows are assigned by bar overlap:
     two labels share a row only when their bars are disjoint.
     (43.6) only labelled bars take a lane; unlabelled bars need no
     room. Extra lanes shift the bar row down inside the timeline so
     every label stays inside the control bar. */
  const bars=[...tl.querySelectorAll(".tlseg")].filter(d=>d.firstChild);
  const above=[];
  for(const d of bars){
    const L=parseFloat(d.style.left)/100*W;
    const rendered=d.getBoundingClientRect();
    const Wd=rendered.width>1?rendered.width:parseFloat(d.style.width)/100*W;
    let lane=0;
    for(;lane<above.length;lane++){
      if(!above[lane].some(b=>!(L+Wd+3<b.x||b.x+b.w+3<L)))break;
    }
    if(lane===above.length)above.push([]);
    above[lane].push({x:L,w:Wd});
    const s=d.firstChild;
    if(s){s.classList.remove("lane1","lane2");s.style.left="";s.style.bottom=(8+lane*18)+"px";}
  }
  const shift=(Math.max(1,above.length)-1)*18;
  for(const d of tl.querySelectorAll(".tlseg"))d.style.top=(22+shift)+"px";
  for(const id of ["tlTrack","tlPlay"]) {const e=$(id);if(e)e.style.top=(30+shift)+"px";}
  for(const d of tl.querySelectorAll(".tltick"))d.style.top=(30+shift)+"px";
  /* (40) point-event labels are measured at their real text width and
     laned so Scale/Verdict-style neighbours sit on separate rows. */
  const lbs=[...tl.querySelectorAll(".tltick .tlbl")];
  lbs.forEach(lb=>{lb.classList.remove("lane1","lane2");lb.style.left="";lb.style.transform="";});
  const below=lanesOf(lbs,lb=>parseFloat(lb.parentElement.style.left)/100*W);
  lbs.forEach(lb=>{
    const x=parseFloat(lb.parentElement.style.left)/100*W;
    lb.style.transform="none";
    lb.style.left=(lb._cx-x)+"px";
    lb.style.top=(10+lb._lane*17)+"px";
  });
  tl.classList.remove("tall","pt2");tl.style.paddingTop="";
  tl.style.height=(56+shift+(Math.max(1,below.length)-1)*17)+"px";
}
/* phone cards below the video, never over it (35.2): the verdict
   card and the scale reference card move into the slot; the stage
   keeps only HUD, badge, rulers, ghosts, caption and trajectories */
function placeVerdict(){
  const slot=$("phoneSlot"),st=$("stage");
  if(!slot||!st)return;
  const phone=window.matchMedia&&window.matchMedia("(max-width: 700px)").matches;
  for(const id of ["verdict","refcard"]){
    const v=$(id);if(!v)continue;
    if(phone){v.classList.add("below");if(v.parentElement!==slot)slot.appendChild(v);}
    else{v.classList.remove("below");if(v.parentElement!==st)st.appendChild(v);}
  }
}
/* ---------- boot ---------- */
function boot(){
  buildIntro();buildRail();buildTimeline();placeVerdict();bindTimeline();
  if(!(R.segments||[]).length){$("chartBlock").style.display="none";}
  /* (47.3) over HTTP(S) (GitHub Pages) the player fetches the whole
     clip once, as a blob, and plays it from an object URL. On file://
     it uses the file directly. */
  if(FLAGS.has_video){
    if(location.protocol.indexOf("http")===0){
      fetch("clip.mp4").then(r=>{if(!r.ok)throw new Error("clip "+r.status);return r.blob();}).then(b=>{vid.src=URL.createObjectURL(b);}).catch(()=>{vid.src="clip.mp4";});
    }else vid.src="clip.mp4";
  }
  else{vid.style.display="none";freeze.style.display="none";if(FLAGS.poster){const pi=$("posterImg");pi.src=FLAGS.poster;pi.style.display="block";}}
  /* (47.3) the ride starts only when the video can play through. */
  S.videoReady=false;
  vid.addEventListener("canplaythrough",()=>{S.videoReady=true;if(S.pendingStart){playFromStart();}});
  vid.addEventListener("loadedmetadata",()=>{fitStage();drawFreeze();applyCam();});
  // 46.1: while the video plays the freeze canvas is hidden and the
  // viewer sees the live video; when it pauses the canvas is drawn and
  // shown. seeked redraws it as before (16).
  vid.addEventListener("playing",()=>{syncFreezeVis();});
  vid.addEventListener("pause",()=>{drawFreeze();});
  vid.addEventListener("seeked",()=>{drawFreeze();});
  fitStage();
  const q=new URLSearchParams(location.search);
  if(q.has("frame")){S.started=true;seekTo(parseInt(q.get("frame"),10)||0,true);}
  else if(q.has("event")){const ev=EVENTS.find(e=>e.id===q.get("event")||e.kind===q.get("event"));S.started=true;if(ev){seekFrame(ev.frame);enterHold(ev,true);}renderStage();applyCam();}
  else{renderStage();applyCam();}
  if(q.get("autoplay")==="1")togglePlay();
  preloadCutouts().then(()=>{renderStage();applyCam();});
  lastT=performance.now();rafId=requestAnimationFrame(tick);
}
document.addEventListener("DOMContentLoaded",boot);
</script>
